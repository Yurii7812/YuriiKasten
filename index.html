<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YuriiNote</title>
<style>
:root{--bg:#fff;--fg:#2b2d33;--sub:#8b909c;--line:#ececef;--acc:#3b5bdb;--acc-bg:color-mix(in srgb,var(--acc) 12%,white);--red:#c0392b;--paper:#8a5a20;--hl:#f5f6f9;--tint:#eef3ff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,"Noto Sans JP",sans-serif;color:var(--fg);background:var(--bg);height:100vh;display:flex;flex-direction:column}
body{font-size:15px}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.top{display:flex;align-items:center;gap:2px;padding:7px 12px;border-bottom:1px solid #f4f4f6;flex-shrink:0}.top .sp{flex:1}
.top input{width:190px;margin:0 6px;padding:4px 12px;border:1px solid transparent;border-radius:8px;font:inherit;font-size:13.5px;background:#f4f5f8;outline:none}
.top input:focus{background:#fff;border-color:var(--line);width:280px}
button.ic{width:28px;height:28px;padding:0;border:0;border-radius:7px;background:none;line-height:1;color:#9a9fac;display:inline-flex;align-items:center;justify-content:center}
button.ic:hover:not(:disabled){background:var(--hl);color:var(--fg)}button.ic:disabled{opacity:.3;cursor:default}
button{font:inherit;font-size:13.5px;padding:3px 10px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;color:#555}
button:hover{background:var(--hl)}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
main{flex:1;display:flex;min-height:0}
#rail{width:42px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-right:1px solid #f0f0f3;background:#fff}
#rail button{width:30px;height:30px;border:0;border-radius:8px;background:none;padding:0;color:#b7bbc6;display:inline-flex;align-items:center;justify-content:center}
#rail button:hover{background:var(--hl);color:#666}#rail button.on{color:var(--acc);background:#f0f2fb}
#dlist details{border-bottom:1px solid #f2f2f2}#dlist summary{padding:6px 12px;cursor:pointer;font-weight:600;color:#444}
#dlist .day{padding:4px 12px 4px 26px;cursor:pointer;display:flex;gap:8px}#dlist .day:hover,#dlist .day.on{background:var(--hl)}
#dlist .day small{color:var(--sub)}#dlist .dtop{padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#dlist .dtop input{font:inherit;font-size:13px;padding:2px 6px;border:1px solid var(--line);border-radius:6px}
.sc-diary{margin-left:6px;color:var(--sub);font-size:13px}.sc-diary input{font-size:13px}
aside{width:250px;display:flex;flex-direction:column;border-right:1px solid #f0f0f3}
#tabs{display:flex;gap:12px;padding:14px 14px 8px}
#tabs button{border:0;border-radius:0;padding:0;background:none;color:#aeb2bf;font-size:12.5px}
#tabs button:hover{background:none;color:#666}#tabs button.on{color:var(--fg);font-weight:600}
#list{flex:1;overflow:auto}
#selbar{display:flex;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub)}
#selbar button{font-size:13px;padding:1px 9px}
button:disabled{opacity:.4;cursor:default}
.ck{margin-right:7px;vertical-align:middle}
.ed .cm-content{padding:10px 8px 40px;tab-size:4}
.md-h{font-weight:700;line-height:1.35}.md-h1{font-size:1.7em}.md-h2{font-size:1.4em}.md-h3{font-size:1.2em}.md-h4,.md-h5,.md-h6{font-size:1.05em}
.md-dim{color:#bbb}.md-b{font-weight:700}.md-i{font-style:italic}.md-s{text-decoration:line-through;color:var(--sub)}
.md-c{font-family:ui-monospace,monospace;font-size:.92em;background:#f1f3f6;border-radius:4px;padding:0 3px}
.md-code-line{font-family:ui-monospace,monospace;font-size:.92em;background:#f6f7f9}
.md-quote{border-left:3px solid #d5dbe8;padding-left:10px;color:#555}
.md-hr-line{background:linear-gradient(#d5dae6,#d5dae6) center/100% 1px no-repeat}.md-hr-w{display:inline-block;width:0}
.md-fence{background:#f6f7f9}.md-fence-top{border-radius:6px 6px 0 0;padding-top:2px}.md-fence-end{border-radius:0 0 6px 6px;padding-bottom:2px}.md-fence.md-fence-top:not(:has(+ .md-code-line)){min-height:1em}
.md-li{padding-top:0}.cm-bullet{display:inline-block;width:14px;text-indent:0;color:#777}
.md-num{color:#777}.md-done{color:var(--sub);text-decoration:line-through}
.cm-check{margin:0 6px 0 0;vertical-align:-1px;width:15px;height:15px;cursor:pointer;accent-color:var(--acc);text-indent:0}
.md-table{border-collapse:collapse;margin:6px 0;cursor:text}.md-table th,.md-table td{border:1px solid var(--line);padding:4px 10px}.md-table th{background:#f6f7f9}
.cm-fold-mark{color:#aaa;cursor:pointer;padding:0 3px}.cm-fold-mark:hover{color:var(--acc)}
.cm-gutters{background:transparent!important;border:0!important;color:#aaa}
.cm-foldPlaceholder{background:#eef1f7;border:0;color:var(--sub);padding:0 6px;border-radius:8px;cursor:pointer}
.lk.file{color:var(--acc);text-decoration-color:#b9c8ea}
.imgname{color:var(--sub);font-size:13px}
.cm-img{padding:4px 0 8px}.cm-img img{max-width:100%;max-height:420px;border:1px solid var(--line);border-radius:6px;display:block}
#pane.drop{outline:2px dashed var(--acc);outline-offset:-8px;background:#f7faff}
.chip.dotted{position:relative;margin-top:9px}
.dotabove{position:absolute;left:0;right:0;top:-12px;text-align:center;font-style:normal;color:var(--red);font-size:11px;line-height:1;cursor:pointer}
.ix .mk-topic{margin-right:6px}
#list h4{margin:10px 12px 2px;font-size:12px;color:var(--sub);font-weight:600}
.item,.ix{padding:5px 12px;border-bottom:1px solid #f2f2f2;cursor:pointer}
.item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item{border-bottom:0}.item:hover,.item.on,.ix.on{background:var(--hl)}
.item b{color:var(--acc);margin-right:7px}.item small{color:var(--sub)}
.item.note,.item.topicrow{white-space:normal;display:flex;align-items:center;gap:6px;padding:6px 14px;border:0}
.nrow{min-width:0;flex:1}.nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;line-height:1.35}
.ns{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.note.on .nt{color:var(--acc)}
.item.topicrow{background:var(--tint)}.item.topicrow:hover{background:#e4ecfd}.item.topicrow .nt{color:#3b4b8a}
.tbadge{font-size:10px;color:#fff;background:#6b86d6;border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.ntitle{flex:1;min-width:120px;font:inherit;font-size:18px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:2px 8px}
.ntitle:hover,.ntitle:focus{border-color:var(--line)}
.ix{cursor:default}.ix b{margin-right:6px}
.tag{font-size:12px;color:var(--sub);margin-left:8px}
.sp{font-size:11px;border-radius:4px;padding:0 5px;margin-right:6px;color:#fff;background:var(--acc)}
.sp.p{background:var(--paper)}
.chip{display:inline-block;margin:1px 5px 1px 0;padding:0 8px;border:1px solid var(--line);border-radius:11px;color:var(--red);cursor:pointer;font-size:14px}
.chip.p{color:var(--paper);border-color:#e6d6c0}.chip.t{color:var(--acc)}.chip.miss{opacity:.45}
.chip:hover{background:var(--hl)}
#right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#tabbar{display:flex;align-items:flex-end;gap:2px;padding:4px 10px 0;background:#fff;border-bottom:1px solid #f4f4f6;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;flex-shrink:0}
.tab{display:flex;align-items:center;gap:6px;max-width:200px;padding:5px 8px 5px 12px;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;color:var(--sub);cursor:pointer;white-space:nowrap;font-size:14px}
.tab span{overflow:hidden;text-overflow:ellipsis}.tab small{margin-left:6px;color:#aaa}
.tab:hover{background:var(--hl)}.tab.on{background:#fff;border-color:transparent;color:var(--fg);box-shadow:inset 0 -2px var(--acc)}
.tab .x{font-weight:400;color:#aaa;padding:0 3px;border-radius:4px}.tab .x:hover{background:#e3e5ea;color:var(--fg)}
.tab-new{border:0;background:none;color:var(--sub);padding:3px 9px;margin-bottom:3px}
#pane:has(.note-map-widget){padding:0;display:flex;flex-direction:column;overflow:hidden}
.graph{flex:1;min-height:0;display:flex;flex-direction:column}
.glegend{display:flex;gap:18px;flex-wrap:wrap;padding:10px 18px;font-size:13px;color:var(--sub,#6b7080);border-bottom:1px solid #eceef3;align-items:center}
.glegend i{display:inline-block;vertical-align:middle;margin-right:6px}
.glegend i.c{width:12px;height:12px;border-radius:50%;border:2px solid var(--acc)}.glegend i.c.p{border-color:#2f9e44}
.glegend i.l{width:22px;height:0;border-top:2px solid var(--acc)}.glegend i.l.g{border-color:#9aa3bd}
.glegend i.t{width:12px;height:12px;border-radius:4px;border:2px solid var(--acc);background:var(--acc-bg)}
.glegend i.d{width:10px;height:10px;border-radius:50%;background:#c0392b}
.glegend .hint{margin-left:auto;opacity:.7}
.note-map-widget{position:relative;flex:1;min-height:0;height:100%;width:100%;overflow:hidden}.note-map-container{position:absolute;inset:0}
.nm-style{display:none;color:var(--sub)}.nm-bg{color:var(--bg)}.nm-anchor{color:var(--acc)}.nm-anchor-icon{color:var(--bg)}
.nm-ctl{position:absolute;z-index:10;display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.nm-tl{top:12px;left:12px}.nm-bl{bottom:12px;left:12px}.nm-br{bottom:12px;right:12px}
.nm-ctl button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:15px;cursor:pointer;color:var(--fg)}.nm-ctl button:hover{background:var(--hl)}.nm-ctl button.on{background:var(--acc-bg);color:var(--acc)}.nm-ctl button:disabled{opacity:.35;cursor:default}
.nm-slider{width:150px;margin:0 10px}
.note-map-container .float-tooltip-kap{max-width:min(260px,90%);padding:6px 10px;border-radius:5px;background:var(--bg);box-shadow:2px 2px 8px rgba(0,0,0,.2);color:var(--fg);font-size:.9rem;text-align:start}
#gsvg{user-select:none;-webkit-user-select:none;flex:1;min-height:0;width:100%;cursor:grab;font-family:inherit;touch-action:none}
#gsvg .gn,#gsvg .gt{cursor:pointer}#gsvg .gn:hover circle{fill:var(--acc-bg)}
#pane{flex:1;min-height:0;overflow:auto;padding:0}
#pane:not(:has(.stage)){padding:14px 24px}
.stage{display:flex;align-items:flex-start;min-height:100%}
.stage:has(#nbody){height:100%;align-items:stretch;min-height:0}
.col:has(#nbody){display:flex;flex-direction:column;min-height:0;padding-bottom:18px}
.col:has(#nbody)>.idline,.col:has(#nbody)>.ntitle{flex:0 0 auto}
.col:has(#nbody)>#nbody{flex:1 1 0}
.col{width:660px;max-width:calc(100% - 290px);margin-left:auto;padding:30px 36px 0 12px;min-width:0}
.col.wide{width:1000px}
.stage:has(#nbody)>.mgn{position:static;min-height:0;margin:0;overflow:auto;padding-top:34px;height:100%}
.stage:has(#nbody)>.col{width:auto;flex:1 1 auto;max-width:none;margin:0 auto;padding:26px 36px 18px}
.stage:has(#nbody)>.col>#nbody>.chat,.stage:has(#nbody)>.col>#nbody>.cvbox{max-width:1100px;margin:0 auto;width:100%}
.mgn{width:260px;margin:0 auto 0 8px;padding:46px 14px 60px 20px;border-left:1px solid #f0f0f3;font-size:12.5px;color:#7a7f8e;position:sticky;top:0;min-height:100vh;align-self:stretch}
.idline{display:flex;align-items:center;gap:4px;font-size:12px;color:#a9aebb;min-height:24px}
.idline .cpid{border:0;background:none;color:#b7bbc6;padding:0;width:18px;height:18px;display:inline-flex}.idline .cpid:hover{color:var(--acc)}
.idline input.idin{width:84px;border:0;background:none;font:inherit;color:#8b909c;padding:0 2px;outline:none;border-radius:4px}.idline input.idin:focus{background:var(--hl)}
.idline .dt{margin-left:8px;color:#c0c4cf}.idline .grow{flex:1}.idline .nm{opacity:0}.col:hover .idline .nm,.idline .nm:focus{opacity:1}
.ixbar{display:flex;align-items:center;gap:8px;padding:6px 4px 10px;font-size:13px}.ixbar .grow{flex:1}
.chip.pick{cursor:pointer}.chip.pick:hover{background:#eef3ff}.chip.pick.on{border-color:#c0392b;background:#fdf1ef}
.exsec{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0;font-size:14px}.exsec label{display:inline-flex;align-items:center;gap:3px}
.exlist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin:6px 0}.exrow{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:14px}.exrow b{color:var(--acc);min-width:3.2em}.exrow .grow{flex:1}.exrow i{font-style:normal;color:#b0b4c0;cursor:pointer;padding:0 6px}.exrow i:hover{color:var(--red)}
.extext{width:100%;height:calc(100% - 60px);min-height:300px;margin-top:10px;font:14px/1.6 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:12px;resize:none;box-sizing:border-box}
.backidx{margin:0 0 6px;color:#7b8090;font-size:14px}.backidx>*{margin-right:8px}
.idline .nb{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 10px;font-size:13.5px;color:var(--acc);margin-left:6px;cursor:pointer;white-space:nowrap}.idline .nb small{color:#8a8f9c;margin-left:2px}.idline .nb:hover{background:#eef3ff}
.idline .gid{border:0;background:none;color:var(--acc);padding:0 4px;font-size:12px}
.ntitle{width:100%;font:inherit;font-size:30px;font-weight:700;line-height:1.35;border:0;outline:none;padding:2px 0;margin:0 0 8px;background:none;color:var(--fg)}
.ntitle::placeholder{color:#d3d6de}
.mgn .sec{margin-bottom:24px}.mgn .sec>.l{font-size:11px;color:#b0b4c0;letter-spacing:.06em;margin-bottom:5px}
.mgn .mk{display:flex;justify-content:space-between;align-items:center;padding:1px 0;color:#4a4f5e;font-size:13px}.mgn .mk b{font-weight:400;color:#c4c8d2;cursor:pointer;opacity:0;padding:0 4px}.mgn .mk:hover b{opacity:1}.mgn .mk b:hover{color:var(--red)}
.mgn .mt{padding:1px 0;font-size:13px;color:#2b2d33}.mgn .mt .tl{color:var(--acc);cursor:pointer;margin-left:6px}.mgn .mt .tl:hover{text-decoration:underline}
.mgn .bl{padding:6px 0;border-bottom:1px solid #f4f4f6;cursor:pointer}.mgn .bl:hover .bh b{color:var(--acc)}
.mgn .bh{font-size:12.5px;color:#4a4f5e}.mgn .bh em{font-style:normal;color:#b0b4c0;font-size:11px;margin-left:6px}
.mgn .bl p{margin:2px 0 0;font-size:12px;color:#8b909c;line-height:1.55}
.mgn .madd{margin-top:30px;display:flex;flex-direction:column;gap:3px}.mgn .madd a{color:#b0b4c0;cursor:pointer;font-size:12px}.mgn .madd a:hover{color:var(--acc)}
.mgn #kw-wrap input{width:160px;font:inherit;font-size:12.5px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;margin:4px 4px 0 0}
.mgn .hint{color:#b7bbc6;font-size:12px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 12px;min-height:28px}
.lbl{font-size:12px;color:var(--sub)}
.kwc{font-size:14px;color:var(--fg);border-bottom:1px solid var(--line);padding:0 2px 0 2px}
.yomi{color:var(--sub);font-size:12px;margin-left:5px}
.kwc b{font-weight:400;color:#aaa;cursor:pointer;padding:0 5px;margin-left:2px;border-radius:8px}.kwc b:hover{color:var(--red)}
.mini{font-size:13px;padding:1px 9px;color:var(--sub);border-style:dashed}
.meta input{font:inherit;font-size:13px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;width:150px;margin-right:4px}
.vsep{width:1px;height:18px;background:var(--line);margin:0 4px}
.chip small{color:var(--sub)}
.ta-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.ta-row{padding:5px 10px;cursor:pointer;border-bottom:1px solid #f2f2f2}.ta-row:hover{background:var(--hl)}
.ta-h{padding:4px 10px;font-size:11px;color:var(--sub);background:#f6f7fa;position:sticky;top:0}.ta-row em{font-style:normal;font-size:11px;color:var(--acc);background:var(--acc-bg);border-radius:8px;padding:0 6px;margin-left:5px}.ta-row.on{background:var(--acc-bg)}.ta-row small{color:var(--sub);margin-left:6px}
.modal hr{border:0;border-top:1px solid var(--line);width:100%;margin:4px 0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row h2{margin:0 8px 0 0;font-size:20px}.grow{flex:1}
.id{font-size:20px;font-weight:700;color:var(--acc);width:110px;border:1px solid transparent;border-radius:6px;padding:2px 6px}
.id:hover,.id:focus{border-color:var(--line)}
.date{color:var(--sub);font-variant-numeric:tabular-nums}
.kw{width:100%;padding:5px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-bottom:10px}
.ed .cm-editor{border:0;border-radius:0;font-size:var(--bodysize,15.5px)}
.ed .cm-editor.cm-focused{outline:none}
.ed .cm-scroller{font-family:var(--bodyfont,inherit);line-height:1.8;overflow:visible!important}
.ed .cm-content{padding:6px 2px 45vh}
.lk{color:var(--red);text-decoration:underline;text-decoration-color:#e8b4ae;text-underline-offset:3px;cursor:pointer}
.mk{color:var(--red)}
.lk.miss{color:#999;text-decoration-style:dotted}
.paper{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.pic img{width:100%;border:1px solid var(--line);border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two h4{margin:6px 0;color:var(--sub);font-size:13px}
table.ti{border-collapse:collapse;width:100%;margin-top:6px}
.ti td{border-bottom:1px solid #f0f0f0;padding:5px 8px;vertical-align:top}.ti td:first-child{width:40%;font-weight:600}
.star{margin-top:8px}
.conf{display:flex;flex-direction:column;gap:10px;max-width:460px;margin-top:8px}.conf label{display:flex;gap:8px;align-items:center}
.conf input,.conf select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:inherit}
button.danger{color:var(--red);border-color:#efc9c4}
.sub{color:var(--sub);font-size:13px}.none{color:var(--sub);padding:30px 12px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:10}
.modal .box{background:#fff;border-radius:10px;padding:18px 20px;width:440px;display:flex;flex-direction:column;gap:8px}
.modal h3{margin:0}.modal input{padding:6px 9px;border:1px solid var(--line);border-radius:6px;font:inherit}
.m-add{margin:3px 4px 0 0}
#scan{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:9}
#scan .top{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#scan input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:inherit}
#scan .view{flex:1;overflow:auto;text-align:center;background:#f6f6f6}#scan .view img{max-width:100%}
@media(max-width:800px){.paper,.two{grid-template-columns:1fr}aside{width:220px}}

#clist .ci{margin-right:8px}#clist .item small{float:right;color:var(--sub)}#clist .dtop{padding:8px 10px;border-bottom:1px solid var(--line)}
.chat{display:flex;flex-direction:column;flex:1;min-height:0;max-width:820px;margin:0 auto;width:100%}
#pane:has(.chat){display:flex;flex-direction:column;overflow:hidden}
.chat-head{flex-shrink:0}
#c-msgs{flex:1;overflow:auto;padding:6px 2px 10px;min-height:0}
.bub{max-width:88%;margin:0 0 10px;padding:8px 12px;background:#f1f4fa;border-radius:12px 12px 12px 3px;width:fit-content}
.chat.memo #c-msgs .bub{margin-left:auto;background:#e3ecfd;border-radius:12px 12px 3px 12px;cursor:pointer}
.chat.memo #c-msgs .bub.open{outline:1.5px solid #9fb3e6}

.kedit .kpal[hidden]{display:none}.kedit .kpal{display:flex;gap:6px;padding:8px 0}.kedit .kpal i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}.kedit .kpal i.on{outline:2px solid var(--acc)}
.similar{max-width:900px;margin:0 auto;padding:6px 8px 40px}.smbar{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0 12px;background:#fafbfe}.smrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:3px 0}.smrow>b{font-size:12px;color:var(--sub);min-width:62px}
.smck{display:inline-flex;gap:4px;align-items:center;font-size:13px;cursor:pointer}.smbar select,.smbar input[type=date]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:1px 4px}
.smrow2{display:block!important;padding:9px 12px!important;border-bottom:1px solid #f0f1f6!important;white-space:normal!important;cursor:pointer}.smrow2:hover{background:var(--hl)}.smtop{display:flex;gap:8px;align-items:baseline}.smt{flex:1;font-weight:500}.smp{color:var(--acc);font-weight:700}
.smmeter{height:4px;background:#eef1fa;border-radius:3px;margin:5px 0}.smmeter i{display:block;height:100%;background:var(--acc);border-radius:3px}.smre{font-size:12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}.smb{border-radius:9px;padding:0 8px;background:var(--acc-bg);color:var(--acc)}.smb-kw{background:#fdecea;color:#c0392b}.smb-link{background:#e6f6ea;color:#2f9e44}.smb-topic{background:#fff3d6;color:#b7791f}
.dsep{text-align:center;font-size:12px;color:var(--sub);margin:14px 0 8px;position:relative}.dsep:before,.dsep:after{content:'';position:absolute;top:50%;width:calc(50% - 70px);height:1px;background:#e3e6ef}.dsep:before{left:0}.dsep:after{right:0}
.ntag{background:#fff3d6;color:#b7791f;border-radius:9px;padding:0 7px;cursor:pointer;font-size:11.5px}.bub.picked{outline:2px solid var(--acc)}.bub.flash{outline:2px solid #f0b429}.bub .bck{vertical-align:-2px}
#c-selbar{display:none;gap:8px;align-items:center;padding:6px 10px;background:#eef2ff;border-top:1px solid #d5ddf7;font-size:13px}#c-selbar .grow{flex:1}.c-compose{position:relative}
#c-mention{position:absolute;bottom:100%;left:44px;right:70px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(30,40,80,.15);overflow:hidden;z-index:5}#c-mention .mn{padding:6px 12px;cursor:pointer;font-size:13.5px}#c-mention .mn.on,#c-mention .mn:hover{background:var(--acc-bg)}#c-mention small{color:var(--sub);margin-left:6px}
.bub a[data-file^="memo:"]{color:var(--acc);background:var(--acc-bg);border-radius:8px;padding:0 6px;text-decoration:none}
.mandala{display:flex;flex-direction:column;height:100%;outline:0;min-height:0}.mhead{padding:2px 4px 6px;font-size:15px}.mhead .sub{margin-left:8px}
.mbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:0 0 8px}.mbar button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;cursor:pointer}.mbar button.on{background:var(--acc-bg);border-color:#b9c6f7;color:var(--acc)}.mbar kbd,.mhelp kbd{font:11px ui-monospace,monospace;color:#889;margin-right:4px}
.mbody{flex:1;min-height:0;display:flex;gap:14px}.mboard{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center}
.mg{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;width:100%;max-width:640px;aspect-ratio:1.15;max-height:100%}
.mc{position:relative;border:1px solid #d9deeb;border-radius:12px;background:#fff;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;overflow:hidden;text-align:center;min-width:0}
.mc:hover{background:#f5f7ff}.mc.ctr{background:var(--acc-bg);border-color:#8da2f0;font-weight:600}.mc.sel{outline:3px solid var(--acc);outline-offset:-2px}.mc b{color:var(--acc);font-size:15px}.mc .mt{font-size:13px;color:#2b2d33;line-height:1.35}.mc i{font-style:normal;font-size:10.5px;color:#8b909c}.mc .mn{position:absolute;left:6px;top:3px;font-size:10px;color:#b0b4c0}
.mc.empty{border-style:dashed;background:#fafbfd;color:#c4c8d2;align-items:center}.mc.empty:hover{background:#f0f4ff;color:var(--acc)}.mc .plus{font-size:20px}
.mc.k-p{border-left:4px solid var(--acc)}.mc.k-c{border-left:4px solid #2f9e44}.mc.k-l{border-left:4px solid #e8a317}.mc.k-b{border-left:4px solid #d9480f}.mc.k-k{border-left:4px solid #c0392b}
.mbig{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;width:100%;height:100%;max-height:100%}.mbig>.mg{max-width:none;gap:2px;aspect-ratio:auto;height:100%}.mbig>.mg.selb{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}
.mc.sm{padding:2px 3px;border-radius:6px}.mc.sm b{font-size:11px}.mc.sm .mt{font-size:10px;line-height:1.2}.mc.sm i,.mc.sm .mn{display:none}.mc.sm.empty .plus{font-size:12px}
.mg.none-b{border:1px dashed #e4e7f0;border-radius:12px;background:none}
.mprev{flex:0 0 340px;overflow:auto;border-left:1px solid #f0f0f3;padding:6px 14px 20px;font-size:14px;line-height:1.7;white-space:pre-wrap;color:#33363f}.mprev h3{margin:4px 0 8px}
.mhelp{position:absolute;right:20px;bottom:20px;background:#fff;border:1px solid #cfd5e3;border-radius:10px;box-shadow:0 6px 24px rgba(30,40,80,.18);padding:12px 16px;font-size:13px;line-height:1.8;max-width:560px}
#tabs{flex-wrap:nowrap;gap:2px;padding-left:10px;padding-right:6px}#tabs button{white-space:nowrap;padding:5px 8px}.sortbar button,.sortbar select,.ixbar button{white-space:nowrap;flex:none}
.sortbar{flex-wrap:nowrap;overflow:hidden}.sortbar select{max-width:100%}
#tabs button .te{font-size:19px;line-height:1}#tabs button .tl{display:none;margin-left:5px}#tabs button.on .tl{display:none}#tabs button{display:flex;align-items:center;padding:4px 9px}
#cardtoggle.on{background:var(--acc-bg);color:var(--acc)}
.item.card .cbody{white-space:pre-wrap;max-height:none}.item.card .cmore{display:inline-block;font-size:12px;color:var(--acc);margin:0 0 4px;cursor:pointer}.item.card{box-shadow:0 1px 2px rgba(30,40,80,.08)}.item.card:hover{box-shadow:0 3px 10px rgba(30,40,80,.14)}
#dlist .kinds{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px 2px}#dlist .kchip{border:1px solid var(--line);border-radius:14px;padding:2px 10px;cursor:pointer;font-size:13px;background:#fff}#dlist .kchip.on{background:var(--acc-bg);border-color:#b9c6f7;color:var(--acc)}
.item.decided{border-radius:0;box-shadow:inset 0 0 0 2px #f0b429}.item.decided.on,.item.on.decided{box-shadow:inset 0 0 0 2px #f0b429,inset 5px 0 0 var(--acc)}
.item.topicrow.on{background:var(--acc-bg);border-radius:0;box-shadow:inset 5px 0 0 var(--acc)}.item.topicrow.decided{box-shadow:inset 0 0 0 2px #f0b429}.ix.on{background:var(--hl);border-radius:0;box-shadow:inset 5px 0 0 var(--acc)}
.item.topicrow.on.decided{box-shadow:inset 0 0 0 2px #f0b429,inset 5px 0 0 var(--acc)}
.chip.entry-on{outline:2px solid var(--acc);outline-offset:1px}
.item.topicrow.tc{margin:6px 10px;padding:9px 12px;border-radius:10px}.item.topicrow.tc.on,.item.topicrow.tc.decided{border-radius:10px}   /* カード表示のとき、トピックIndex の行も、カードと同じ幅に */
body{font-family:var(--uifont,inherit)}
html.dark{filter:invert(.92) hue-rotate(180deg);background:#fff}html.dark img,html.dark .kimg,html.dark video,html.dark .pic img{filter:invert(1) hue-rotate(180deg)}
#rail #settings-btn{margin-top:auto;font-size:18px}
.sdlg h3{margin:0 0 8px}.sdlg .sec{border-top:1px solid var(--line);padding:10px 0}.sdlg .sec:first-of-type{border-top:0}.sdlg .sec>b{display:block;font-size:12px;color:var(--sub);letter-spacing:.06em;margin-bottom:6px}
.sdlg .srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}.sdlg .srow>span{min-width:110px;font-size:13px}.sdlg .sw{display:inline-block;width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}.sdlg .sw.on{border-color:#222}
.sdlg input[type=range]{flex:1;min-width:120px}.sdlg select,.sdlg input[type=text],.sdlg input[type=number]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.box:has(.sdlg){width:min(560px,94vw);max-height:88vh;overflow:auto}
/* 画面の文字（ボタン・一覧・見出しなど）は範囲選択できない。ノートの本文・入力欄・チャットのメモは選べる */
body{-webkit-user-select:none;user-select:none}
.cm-editor,.cm-content,input,textarea,select,[contenteditable],.b-body,.md,.mprev{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<main>
  <nav id="rail"><button data-mode="notes" title="ノート">📝</button><button data-mode="diary" title="日記">📔</button><button data-mode="chat" title="チャットメモ">💬</button><button data-mode="pindex" title="紙のIndex（並べ替え）">🗂</button><button data-mode="graph" title="グラフ">🕸</button><button data-mode="mandala" title="曼荼羅">❖</button><button data-mode="cards" title="カード（Google Keep 風・画面いっぱい）">🗒️</button><button id="settings-btn" title="設定">⚙️</button></nav>
  <aside>
    <div id="tabs"><button data-tab="d" title="デジタル"><span class="te">💻</span></button><button data-tab="p" title="紙"><span class="te">📜</span></button><button data-tab="u" title="未整理（IDなし）"><span class="te">📥</span></button><button data-tab="f" title="ファイル（画像・html・csv など）"><span class="te">📎</span></button><button data-tab="i" title="Index（キーワード）"><span class="te">🔖</span></button></div>
    <div id="selbar"></div>
    <div id="list"></div>
  </aside>
  <section id="right">
    <div class="top">
      <button id="nav-back" class="ic" title="戻る (Alt+←)" disabled><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="nav-fwd" class="ic" title="進む (Alt+→)" disabled><svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="sp"></span>
      <input id="q" placeholder="検索" title="Ctrl+F　（Esc でやめる）">
      <button id="cardtoggle" class="ic" title="一覧・カードの表示を切り替え"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button><button id="new" class="ic" title="新規"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="more" class="ic" title="メニュー"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      <button id="imp" hidden></button><button id="vault" hidden></button>
    </div>
    <div id="tabbar"></div><div id="pane"></div>
  </section>
</main>

<div id="modal" class="modal"><div class="box"></div></div>

<div id="scan">
  <div class="top">
    <b id="sc-n"></b>
    <span>紙のID</span><input id="sc-id" style="width:110px;font-size:18px">
    <span class="sub">キーワード</span><input id="sc-kw" placeholder="任意（、で区切る）">
    <button id="sc-ok" class="p">決定して次へ (Enter)</button>
    <button id="sc-skip">飛ばす</button>
    <span class="sc-diary">｜ 紙の日記なら <input id="sc-date" type="date"><button id="sc-diary" title="Alt+D">日記として登録</button></span>
    <button id="sc-prev">前のID (Tab)</button>
    <button id="sc-close">閉じる (Esc)</button>
    <span id="sc-msg" class="sub"></span>
  </div>
  <div class="view"><img id="sc-img"></div>
</div>
<script src="dist/app.js"></script>
</body>
</html>
